name: deploy

# Manual-only until GitHub Pages is turned on for this repo
# (Settings → Pages → Source: GitHub Actions). Flip this to
#   push:
#     branches: [main]
# once it is, or delete the file if undoai.lol is served from somewhere else —
# a repo deployed elsewhere shouldn't carry a workflow that fails on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
